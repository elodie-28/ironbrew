<!DOCTYPE html>
<html lang="en">
<head>
    <title>Forgot your password?</title>
    <th:block th:insert="~{layout.html :: headerfiles}">
    </th:block>
</head>
<body>
<header th:insert="~{layout.html :: header}"></header>
<main class="d-flex container justify-content-center align-items-center">
    <div class="card shadow p-4 mt-4" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-4">Forgot Your Password?</h3>
        <form th:action="@{/forgot-password}" th:object="${forgotPasswordRequest}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label">Email address <span class="text-danger">*</span></label>
                <input type="email" class="form-control" th:errorclass="is-invalid"
                       id="email" name="email" th:field="*{email}" required/>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="d-flex justify-content-center">
                <button type="submit" class="btn btn-primary">Send a password reset request</button>
            </div>
        </form>
        <div th:if="${successForgotPasswordMessage}" class="alert alert-success my-3" th:text="${successForgotPasswordMessage}">
        </div>
    </div>
</main>
</body>
</html>
