<!DOCTYPE html>
<html lang="en">
<head>
    <title>Ironbrew - Asset collections</title>
    <th:block th:insert="~{layout.html :: headerfiles}">
    </th:block>
</head>
<body>
<header th:insert="~{layout.html :: header}"></header>
<main>
    <div class="border-bottom">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/your-expansions}">Expansions</a></li>
                    <li class="breadcrumb-item active" aria-current="page" th:text="${expansionTitle}"></li>
                </ol>
            </nav>
            <h2 class="text-center" th:text="${expansionTitle}">Expansion Title</h2>
            <ul class="nav nav-tabs border-bottom-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/expansions/{id}(id=${expansionId})}">Details</a>
                </li>
                <li class="nav-item">
                    <a
                            class="nav-link active"
                            aria-current="page"
                            th:href="@{/expansions/{id}/asset-collections(id=${rulesPackageId})}">
                        Asset collections
                    </a>
                </li>
            </ul>
        </div>
    </div>
    <div class="container my-4">
        <div class="d-flex justify-content-center mb-4">
            <a th:href="@{/expansions/{id}/asset-collections/new(id=${expansionId})}" class="btn btn-primary">Create asset collection</a>
        </div>
        <div
                class="list-group"
                th:if="${!assetCollections.isEmpty()}">
            <a
                    th:each="assetCollection : ${assetCollections}"
                    th:href="@{/asset-collections/{id}(id=${assetCollection.id()})}"
                    class="list-group-item list-group-item-action">
                <div class="d-flex w-100 justify-content-between">
                    <h5 class="mb-1" th:text="${assetCollection.name()}">Asset collection name</h5>
                    <small class="text-body-secondary">X assets</small>
                </div>
                <p class="mb-1" th:text="${assetCollection.summary()}">Asset collection summary</p>
            </a>
        </div>
    </div>
</main>
</body>
</html>
