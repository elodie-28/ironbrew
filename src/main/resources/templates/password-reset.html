<!DOCTYPE html>
<html lang="en">
<head>
    <title>Reset your password</title>
    <th:block th:insert="~{layout.html :: headerfiles}">
    </th:block>
</head>
<body>
<header th:insert="~{layout.html :: header}"></header>
<main class="d-flex container justify-content-center align-items-center">
    <div class="card shadow p-4 mt-4" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-4">Reset your password</h3>
        <form th:action="@{/password-reset}" th:object="${passwordResetRequest}" method="post">
            <div class="mb-3">
                <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                <input type="password" class="form-control" th:errorclass="is-invalid" id="password" name="password" th:field="*{password}" required/>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>
            <div class="mb-3">
                <label for="confirmationPassword" class="form-label">Confirm your password <span class="text-danger">*</span></label>
                <input type="password" class="form-control" th:errorclass="is-invalid" id="confirmationPassword" name="confirmationPassword" th:field="*{confirmationPassword}" required aria-describedby="passwordHelpBlock"/>
                <div id="passwordHelpBlock" class="form-text">
                    Your password must be at least 8 characters long and contain:
                    <ul>
                        <li>A lowercase letter</li>
                        <li>An uppercase letter</li>
                        <li>A number</li>
                        <li>A special character from the following: #?!@$%^&*-</li>
                    </ul>
                </div>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmationPassword')}" th:errors="*{confirmationPassword}"></div>
            </div>
            <input type="hidden" th:field="*{token}">
            <div class="d-flex justify-content-center">
                <button type="submit" class="btn btn-primary">Reset your password</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
