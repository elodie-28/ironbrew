<!DOCTYPE html>
<html lang="en">
<head>
    <title>Ironbrew - My Account</title>
    <th:block th:insert="~{layout.html :: headerfiles}">
    </th:block>
</head>
<body>
<header th:insert="~{layout.html :: header}"></header>
<main class="container">
    <div class="row">
        <div class="col-2 py-3 border-end border-1">
            <h3>My Account</h3>
            <ul class="nav nav-pills flex-column">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/my-account}">Profile</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/my-account/password}">Password</a>
                </li>
            </ul>
        </div>
        <div class="col-10">
            <div class="alert alert-success my-2" th:if="${successChangePasswordMessage}" th:text="${successChangePasswordMessage}"></div>
            <form th:action="@{/my-account/password}" th:object="${changePasswordRequest}" method="post">
                <div class="my-3">
                    <div class="row mb-3">
                        <label for="oldPassword" class="col-sm-2 col-form-label">Old password</label>
                        <div class="col-sm-10">
                            <input type="password" class="form-control"
                                   th:errorclass="is-invalid" id="oldPassword"
                                   name="oldPassword"
                                   th:field="*{oldPassword}" required/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('oldPassword')}"
                                 th:errors="*{oldPassword}"></div>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <label for="newPassword" class="col-sm-2 col-form-label">New password</label>
                        <div class="col-sm-10">
                            <input type="password" class="form-control"
                                   th:errorclass="is-invalid" id="newPassword"
                                   name="newPassword"
                                   th:field="*{newPassword}" required aria-describedby="passwordHelpBlock"/>
                            <div id="passwordHelpBlock" class="form-text">
                                Your password must be at least 8 characters long and contain:
                                <ul>
                                    <li>A lowercase letter</li>
                                    <li>An uppercase letter</li>
                                    <li>A number</li>
                                    <li>A special character from the following: #?!@$%^&*-</li>
                                </ul>
                            </div>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}"
                                 th:errors="*{newPassword}"></div>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <label for="confirmPassword" class="col-sm-2 col-form-label">Confirm password</label>
                        <div class="col-sm-10">
                            <input type="password" class="form-control"
                                   th:errorclass="is-invalid"
                                   id="confirmPassword" name="confirmPassword"
                                   th:field="*{confirmPassword}" required/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}"
                                 th:errors="*{confirmPassword}"></div>
                        </div>
                    </div>
                </div>
                <div class="d-flex justify-content-center">
                    <button type="submit" class="btn btn-primary">Change your password</button>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
