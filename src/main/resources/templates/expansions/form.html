<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <title th:text="${isEdit ? 'Ironbrew - Edit your expansion' : 'Ironbrew - Create your expansion'}"></title>
    <th:block th:insert="~{layout.html :: headerfiles}">
    </th:block>
</head>
<body>
<header th:insert="~{layout.html :: header}"></header>
<main class="container">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
            <li class="breadcrumb-item"><a th:href="@{/your-expansions}">Expansions</a></li>
        </ol>
    </nav>
    <h2 class="text-center" th:text="${isEdit ? 'Edit your expansion' : 'Create your expansion'}"></h2>
    <form th:action="${isEdit}? @{/expansions/{id}(id=${id})} : @{/expansions}"
          th:object="${expansion}"
          method="post">
        <div class="mb-3">
            <label for="title" class="form-label">Title <span class="text-danger">*</span></label>
            <input type="text" class="form-control" th:errorclass="is-invalid"
                   id="title" name="title" th:field="*{title}" required/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
        </div>
        <div class="mb-3">
            <label for="dataswornId" class="form-label">Datasworn ID</label>
            <input type="text" class="form-control" th:errorclass="is-invalid"
                   id="dataswornId" name="dataswornId" th:field="*{dataswornId}"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('dataswornId')}" th:errors="*{dataswornId}"></div>
        </div>
        <div class="mb-3">
            <label for="releaseDate" class="form-label">Release date <span class="text-danger">*</span></label>
            <input type="date" class="form-control" th:errorclass="is-invalid"
                   id="releaseDate" name="releaseDate" th:field="*{releaseDate}" required/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('releaseDate')}" th:errors="*{releaseDate}"></div>
        </div>
        <div class="mb-3">
            <label for="url" class="form-label">URL <span class="text-danger">*</span></label>
            <input type="text" class="form-control" th:errorclass="is-invalid"
                   id="url" name="url" th:field="*{url}" required/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('url')}" th:errors="*{url}"></div>
        </div>
        <div class="mb-3">
            <label for="license" class="form-label">License</label>
            <input type="text" class="form-control" th:errorclass="is-invalid"
                   id="license" name="license" th:field="*{license}"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('license')}" th:errors="*{license}"></div>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" rows="5" th:errorclass="is-invalid"
                   id="description" name="description" th:field="*{description}">
            </textarea>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>
        <div class="mb-3">
            <label for="ruleset" class="form-label">Ruleset <span class="text-danger">*</span></label>
            <select class="form-control" th:errorclass="is-invalid"
                   id="ruleset" name="ruleset" th:field="*{ruleset}">
                <option value="ironsworn">Ironsworn</option>
                <option value="starforged">Ironsworn: Starforged</option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('ruleset')}" th:errors="*{ruleset}"></div>
        </div>
        <div class="mb-2">
            <button type="submit" class="btn btn-primary">Save your changes</button>
        </div>
    </form>
</main>
</body>
</html>
