<!DOCTYPE html>
<html lang="en">
<head>
    <title>Ironbrew - Your Expansions</title>
    <th:block th:insert="~{layout.html :: headerfiles}">
    </th:block>
</head>
<body>
<header th:insert="~{layout.html :: header}"></header>
<main class="container">
    <h1 class="text-center">Your Expansions</h1>
    <div class="d-flex justify-content-center">
        <a th:href="@{/expansions/new}" class="btn btn-primary">Create expansion</a>
    </div>
    <div th:if="${successDeleteMessage}" class="alert alert-success">
        <span th:text="${successDeleteMessage}"></span>
    </div>
    <div class="row row-cols-1 row-cols-md-2 g-4 m-2">
        <div th:each="expansion: ${expansions}">
            <div class="col">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${expansion.getTitle()}"></h5>
                        <p class="card-text" th:text="${#strings.abbreviate(expansion.getDescription(), 160)}">No
                            description
                        </p>
                        <div class="d-flex gap-2">
                            <a th:href="@{/expansions/{id}(id=${expansion.getId()})}" class="btn btn-outline-primary">View</a>
                            <a th:href="@{/expansions/{id}/edit(id=${expansion.getId()})}" class="btn btn-outline-primary">Edit</a>
                            <form th:action="@{/expansions/{id}/delete(id=${expansion.getId()})}"
                                  class="d-inline-flex"
                                  method="post"
                                  onsubmit="return confirm('Are you sure you want to delete this expansion? This action cannot be undone.');">
                                <button type="submit" class="btn btn-outline-danger">Delete</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <nav aria-label="Page navigation">
        <ul class="pagination justify-content-center m-2">
            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/your-expansions(page=${currentPage - 1})}">
                    Previous
                </a>
            </li>
            <li class="page-item"
                th:each="i : ${#numbers.sequence(1, totalPages)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link"
                   th:href="@{/your-expansions(page=${i})}"
                   th:text="${i}">
                </a>
            </li>
            <li class="page-item"
                th:classappend="${currentPage + 1 > totalPages} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/your-expansions(page=${currentPage + 1})}">
                    Next
                </a>
            </li>
        </ul>
    </nav>
</main>
</body>
</html>
