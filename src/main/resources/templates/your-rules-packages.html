<!DOCTYPE html>
<html lang="en">
<head>
    <title>Ironbrew - Your Rules Packages</title>
    <th:block th:insert="~{layout.html :: headerfiles}">
    </th:block>
</head>
<body>
<header th:insert="~{layout.html :: header}"></header>
<main class="container">
    <h1 class="text-center">Your Rules Packages</h1>
    <div th:each="expansion: ${expansions}">
        <div class="card" style="width: 18rem;">
            <div class="card-body">
                <h5 class="card-title" th:text="${expansion.getTitle()}"></h5>
                <p class="card-text" th:text="${#strings.abbreviate(expansion.getDescription(), 100)}">No description</p>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item"><b>Type:</b> Expansion</span></li>
                </ul>
                <a href="#" class="btn btn-primary">Edit</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
