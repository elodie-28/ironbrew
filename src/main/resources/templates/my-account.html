<!DOCTYPE html>
<html lang="en">
<head>
    <title>Ironbrew - My Account</title>
    <th:block th:insert="~{layout.html :: headerfiles}">
    </th:block>
</head>
<body>
<header th:insert="~{layout.html :: header}"></header>
<main class="container">
    <h1 class="text-center">My Account</h1>
    <div class="mb-3">
        <div class="alert alert-success" th:if="${param.success}">Your changes have been applied.</div>
        <form th:action="@{/my-account}" th:object="${user}" method="post">
            <div class="my-3">
                <div class="row mb-3">
                    <label for="email" class="col-sm-2 col-form-label">Email address</label>
                    <div class="col-sm-10">
                        <input type="email" class="form-control"
                               id="email" name="email" th:field="*{email}" readonly/>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="name" class="col-sm-2 col-form-label">Name</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" id="name" name="name"
                               th:field="*{name}" required/>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="website" class="col-sm-2 col-form-label">Website</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control"
                               th:classappend="${#fields.hasErrors('website')} ? 'is-invalid'" id="website"
                               name="website" th:field="*{website}"/>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('website')}"
                             th:errors="*{website}"></div>
                    </div>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="isEmailPublic" name="isEmailPublic"
                           th:field="*{emailPublic}" aria-describedby="isEmailPublicHelpBlock"/>
                    <label for="isEmailPublic" class="form-label">Is your email public?</label>
                    <div id="isEmailPublicHelpBlock" class="form-text">
                        If yes, your email will be visible when exporting rules packages to the Datasworn format.
                    </div>
                </div>
            </div>
            <div class="d-flex justify-content-center">
                <button type="submit" class="btn btn-primary">Submit your changes</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
