<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" >
<head>
    <title th:remove="all">Template for HTML email with inline image</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <style>
        .btn-wrap { text-align:center; padding:12px 0 20px 0; }
        .btn { display:inline-block; font-weight:600; text-decoration:none; padding:12px 20px; border-radius:6px; }
        .btn-primary { background:#2563eb; color:#ffffff; }
    </style>
</head>
<body>
<p>
    We received a request to reset the password for your account.
    If you made this request, click the button below to reset your password.
</p>
<div class="btn-wrap">
    <a th:href="${passwordResetLink}" class="btn btn-primary" target="_blank">Reset your password</a>
</div>
</body>
</html>
