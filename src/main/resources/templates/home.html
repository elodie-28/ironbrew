<!DOCTYPE html>
<html lang="en">
<head>
    <title>Ironbrew Homepage</title>
    <th:block th:insert="~{layout.html :: headerfiles}">
    </th:block>
</head>
<body>
    <header th:insert="~{layout.html :: header}"></header>
    <main class="container">
        <div th:if="${successSignUpMessage}" class="alert alert-success my-3" th:text="${successSignUpMessage}">
        </div>
        <div th:if="${successPasswordResetMessage}" class="alert alert-success my-3" th:text="${successPasswordResetMessage}">
        </div>
        <h1>Hello world</h1>
    </main>
</body>
</html>
