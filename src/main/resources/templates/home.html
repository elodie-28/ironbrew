<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <title>Ironbrew Homepage</title>
    <th:block th:insert="~{layout.html :: headerfiles}">
    </th:block>
</head>
<body>
    <header th:insert="~{layout.html :: header}"></header>
    <main class="container">
        <div th:if="${successSignUpMessage}" class="alert alert-success my-3" th:text="${successSignUpMessage}">
        </div>
        <div th:if="${successPasswordResetMessage}" class="alert alert-success my-3" th:text="${successPasswordResetMessage}">
        </div>
        <div class="row my-3">
            <div class="col-6 align-content-center">
                <h1 class="display-3">Welcome to <span class="text-primary">Ironbrew</span></h1>
                <h2 class="display-6">
                    Create homebrew content for <i>Ironsworn</i> or <i>Ironsworn: Starforged</i> and export it to Datasworn format.
                </h2>
                <div sec:authorize="isAuthenticated()">
                    <a th:href="@{/your-expansions}" class="btn btn-primary my-2">Go to your expansions</a>
                </div>
                <div sec:authorize="!isAuthenticated()">
                    <a th:href="@{/sign-up}" class="btn btn-primary my-2">Sign up to create homebrew content</a>
                </div>
            </div>
            <div class="col-6">
                <img src="https://placehold.co/600x400"/>
            </div>
        </div>
    </main>
</body>
</html>
