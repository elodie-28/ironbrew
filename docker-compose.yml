services:
  postgres-db:
    image: postgres:17
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ironbrew
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - 5432:5432
  mailpit:
    image: axllent/mailpit
    ports:
      - 8025:8025
      - 1025:1025

volumes:
  postgresql_data: